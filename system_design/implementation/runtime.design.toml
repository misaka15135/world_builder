# Unreleased design configuration. Secrets and real endpoints are intentionally absent.
config_version = "stack-2026-11-12"

[server]
host = "127.0.0.1"
port = 8765
workers = 1
loop = "asyncio"
http = "h11"
session_auth = "X-Workbench-Token"

[storage]
path_policy = "platformdirs-local"
network_filesystem = "reject"
journal_mode = "WAL"
synchronous = "FULL"
busy_timeout_ms = 5000
foreign_keys = true
sqlite_min_version = "3.45.0"

[runtime]
max_operations = 1
max_model_concurrency = 2
max_tool_concurrency = 2
worker_processes = 2
max_model_calls = 24
max_tool_calls = 64
max_total_tokens = 120000
max_output_tokens = 8192
operation_deadline_seconds = 900
model_deadline_seconds = 120
tool_deadline_seconds = 60
cancel_grace_seconds = 5
max_attempts_per_call = 3

[transport]
connect_timeout_seconds = 10
read_timeout_seconds = 120
write_timeout_seconds = 30
pool_timeout_seconds = 5
follow_redirects = false
trust_env = false
verify_tls = true
max_connections = 8
max_keepalive_connections = 4
max_response_bytes = 4194304

[limits]
max_request_bytes = 1048576
max_blob_bytes = 67108864
max_candidate_bytes = 134217728
worker_memory_bytes = 536870912
max_instances = 10000
max_triangles = 500000
max_region_m = 512

[preview]
width_px = 1280
height_px = 720
max_pixel_ratio = 2
poll_interval_ms = 1000
hidden_poll_interval_ms = 5000

[provider]
enabled = false
adapter = "chat-completions-tools"
protocol = "native_tools"
endpoint = "https://llm.example.invalid/v1/chat/completions"
model = "replace-with-probed-model-id"
credential_ref = "keyring:world-builder/llm-primary"

[mcp]
enabled = false
protocol_version = "2026-07-28"
transport = "stdio"
server_registration = "builtin-knowledge-readonly"

[retention]
log_max_bytes = 10485760
log_backups = 5
cache_days = 30
source_gc_automatic = false
raw_secret_logging = false
